name: pipeline entrega evaluacion 1
on:
  push:
    branches: [main, feature/jacoco-setup]
  

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout
        uses: actions/checkout@v7
      - name: Verifica el contenido del repositorio
        run:
          echo "Este es el arbol del contenido del repositorio:"
          tree
      
      - name: Verificar Node
        run:
          node --version

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' 
          cache: 'maven' # Configura automáticamente el caché de Maven sin necesitar actions/cache por separado

        # Paso de Snyk
      
      - name: Configurar Snyk CLI
        uses: snyk/actions/setup@master
      - name: Dar permisos de ejecución a mvnw
        run: chmod +x productos_ev1/mvnw
        
      - name: Run Snyk to check for vulnerabilities
        run: snyk test -d --file=pom.xml
        working-directory: ./productos_ev1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Ejecutar comandos de prueba
        run: echo "¡El pipeline se está ejecutando correctamente!"

      # Paso 4: Construir el proyecto y ejecutar tests
      - name: Ejecutar pruebas y generar reporte de JaCoCo
        run: mvn clean verify
        working-directory: ./productos_ev1

      # Paso 5: Publicar reporte de cobertura de JaCoCo
      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always() #Garantiza que suba el reporte incluso si falla algun test
        with:
          name: jacoco-report
          path: target/site/jacoco/
    
  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: prueba # Espera a que termine el job 'prueba' correctamente

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar JDK
      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Paso 3: Construir el artefacto JAR
      - name: Construir el artefacto JAR
        run:  mvn clean package -DskipTests
        working-directory: ./productos_ev1

      # Paso 4: Subir artefacto JAR
      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # configurar el build y push a GHCR
  docker-push:
    name: Build & Push Docker a GHCR
    runs-on: ubuntu-latest
    needs: [prueba, build] # Se ejecuta unicamente si las pruebas y el build del JAR terminan bien

    permissions:
      contents: read
      packages: write # Requerido para publicar paquetes en GHCR

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./productos_ev1 # Carpeta raíz del código donde está el pom.xml
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          